services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:php8.3-fpm  # sin versión de WordPress: el núcleo vive en el volumen y lo actualiza WP-CLI; la etiqueta solo fija PHP
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    # WordPress se llama a sí mismo (salud del sitio, API, loopback) por su nombre
    # público: dentro del CT tiene que llegar al nginx de aquí, porque cosmos no hace
    # NAT loopback y la IP pública no da la vuelta.
    extra_hosts:
      - "commodoremalacca.club:host-gateway"
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/mcclub-core:/var/www/html/wp-content/plugins/mcclub-core
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/zzz-uploads.ini:ro
    networks:
      - backend

networks:
  backend:

volumes:
  db_data:
  wp_data:
