# Producción - Usar con:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        WORDPRESS_API_URL: ${WORDPRESS_API_URL:-https://commodoremalacca.club/wp-json}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      - WORDPRESS_API_URL=${WORDPRESS_API_URL:-https://commodoremalacca.club/wp-json}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    extra_hosts:
      - "commodoremalacca.club:host-gateway"
    networks:
      - backend

  nginx:
    # Versión LTS fija del CRS 4; actualizar con `docker compose pull nginx`.
    image: owasp/modsecurity-crs:4.25-nginx-alpine-lts
    # Registro de auditoría a la salida del contenedor (la ruta del volumen no
    # la podía crear el usuario de nginx y no se escribía nada), con rotación.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      - wordpress
      - frontend
    ports:
      - "80:80"
      - "443:443"
      # Solo para el balanceador, con PROXY protocol (ver nginx/site.conf)
      - "9443:9443"
    environment:
      # ModSecurity
      - MODSEC_RULE_ENGINE=On
      - MODSEC_AUDIT_LOG=/dev/stdout
      - BLOCKING_PARANOIA=1
      # Desactiva la inspeccion del cuerpo de respuesta: el buffering de
      # libmodsecurity rompe el framing HTTP/2 (ERR_HTTP2_PROTOCOL_ERROR)
      # en respuestas generadas por PHP como /wp-admin/. Mantiene el WAF de entrada.
      - MODSEC_RESP_BODY_ACCESS=Off
      # Ajustes para WordPress
      - ALLOWED_METHODS=GET HEAD POST OPTIONS PUT DELETE
      - MAX_FILE_SIZE=67108864
      # Permite subir archivos grandes (videos) por wp-admin y REST API.
      # Por defecto el limite es 12,5MB con Reject -> 403 en archivos mayores.
      # ProcessPartial inspecciona el inicio del cuerpo pero no rechaza subidas grandes.
      - MODSEC_REQ_BODY_LIMIT=67108864
      - MODSEC_REQ_BODY_LIMIT_ACTION=ProcessPartial
      - MAX_NUM_ARGS=512
      - ARG_LENGTH=8000
      - TOTAL_ARG_LENGTH=64000
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/site.conf:ro
      - ./nginx/modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./nginx/modsecurity/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      # Plugin oficial del CRS con las excepciones de WordPress (v1.2.0)
      - ./nginx/modsecurity/plugins/wordpress-rule-exclusions-config.conf:/etc/modsecurity.d/owasp-crs/plugins/wordpress-rule-exclusions-config.conf:ro
      - ./nginx/modsecurity/plugins/wordpress-rule-exclusions-before.conf:/etc/modsecurity.d/owasp-crs/plugins/wordpress-rule-exclusions-before.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - wp_data:/var/www/html:ro
      - modsec_logs:/var/log/modsecurity
    networks:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  modsec_logs:
