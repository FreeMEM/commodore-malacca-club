# Se carga antes que wordpress-rule-exclusions-before.conf (orden alfabético).
# Las mismas dos reglas que freemem.space (repo FreeMEM/freemem.space), 31/10/2026.
#
# El plugin oficial quita todas las reglas del CRS a parámetros como "search",
# "content" o "title" en /wp-json/wp/v2/posts y compañía, para que Gutenberg pueda
# guardar entradas (reglas 9507142 y 9507143). Eso vale también para cualquier
# anónimo: "/wp-json/wp/v2/posts?search=1' OR 1=1--" pasaba el WAF (comprobado aquí el 31/10/2026).
# Sin sesión de WordPress esas exclusiones no hacen falta, así que se apagan.
SecRule REQUEST_FILENAME "@beginsWith /wp-json/" \
    "id:1100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule &REQUEST_COOKIES_NAMES:/^wordpress_logged_in_/ "@eq 0" \
        "t:none,\
        ctl:ruleRemoveById=9507142-9507143"

# Guardar una entrada o una página manda el texto entero en un solo campo
# (json.content): con más de 8.000 caracteres la regla 920370 lo tiraba y el
# editor decía "La respuesta no es una respuesta JSON válida" (31/10/2026).
# Con sesión de WordPress se quitan los topes de longitud al guardar contenido.
SecRule REQUEST_FILENAME "@rx ^/wp-json/wp/v2/(?:posts|pages|blocks)(?:/|$)" \
    "id:1101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule &REQUEST_COOKIES_NAMES:/^wordpress_logged_in_/ "@gt 0" \
        "t:none,\
        ctl:ruleRemoveById=920370,\
        ctl:ruleRemoveById=920390"
