# WordPress Exclusions - Before CRS
# Estas reglas se ejecutan ANTES de las reglas CRS
#
# Las excepciones miran REQUEST_FILENAME (la ruta, sin la query) y no REQUEST_URI.
# REQUEST_URI incluye la query, así que «@endsWith /post.php» o «@contains /ruta/»
# se cumplían en cualquier dirección con «?x=/post.php» detrás: cualquiera podía
# apagar las reglas de inyección SQL a voluntad (comprobado el 21/10/2026).
# Nunca quitar la 949110: es la que bloquea; sin ella ModSecurity solo apunta.
#
# Gutenberg, la REST API, subidas y admin-ajax los cubre el plugin oficial
# wordpress-rule-exclusions del CRS (montado en owasp-crs/plugins/).

# Permitir métodos necesarios para WordPress
SecAction "id:900200,phase:1,pass,t:none,nolog,setvar:tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE"

# Aumentar límites para el editor de WordPress (Gutenberg)
SecAction "id:900300,phase:1,pass,t:none,nolog,setvar:tx.max_num_args=512"
SecAction "id:900310,phase:1,pass,t:none,nolog,setvar:tx.arg_length=8000"
SecAction "id:900320,phase:1,pass,t:none,nolog,setvar:tx.total_arg_length=64000"

# Excluir wp-admin de algunas reglas estrictas
SecRule REQUEST_FILENAME "@beginsWith /wp-admin/" "id:1000,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920170"
SecRule REQUEST_FILENAME "@beginsWith /wp-admin/" "id:1001,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=921180"
SecRule REQUEST_FILENAME "@beginsWith /wp-admin/" "id:1002,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=930120"

# Excluir wp-json API de reglas que causan falsos positivos
# (las de inyección SQL y la 949110 se quitaron el 21/10/2026: dejaban la API sin bloqueo)
SecRule REQUEST_FILENAME "@beginsWith /wp-json/" "id:1010,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920170"
SecRule REQUEST_FILENAME "@beginsWith /wp-json/" "id:1011,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=921110"

# Excluir upload de archivos
SecRule REQUEST_FILENAME "@streq /wp-admin/async-upload.php" "id:1020,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=200003"

# Excluir post.php y admin-ajax.php de reglas de cuerpo
SecRule REQUEST_FILENAME "@streq /wp-admin/post.php" "id:1030,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=942100"
SecRule REQUEST_FILENAME "@streq /wp-admin/post.php" "id:1031,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=942200"
SecRule REQUEST_FILENAME "@streq /wp-admin/post.php" "id:1032,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=942260"
SecRule REQUEST_FILENAME "@streq /wp-admin/post.php" "id:1033,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=941100"
SecRule REQUEST_FILENAME "@streq /wp-admin/post.php" "id:1034,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=941160"

SecRule REQUEST_FILENAME "@streq /wp-admin/admin-ajax.php" "id:1040,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=942100"
SecRule REQUEST_FILENAME "@streq /wp-admin/admin-ajax.php" "id:1041,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=942200"
SecRule REQUEST_FILENAME "@streq /wp-admin/admin-ajax.php" "id:1042,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=942260"
SecRule REQUEST_FILENAME "@streq /wp-admin/admin-ajax.php" "id:1043,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=941100"

# Ficheros estáticos de Next.js: las rutas dinámicas llevan corchetes en el nombre
# (/_next/static/chunks/app/noticias/%5Bslug%5D/page-….js) y la 932130 los toma por
# una expresión de shell. Son ficheros fijos que sirve Next.js. Visto el 21/10/2026.
SecRule REQUEST_FILENAME "@beginsWith /_next/static/" "id:1050,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=932130"
