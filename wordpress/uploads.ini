; Límites de subida para WordPress (vídeos y archivos grandes vía wp-admin y REST API)
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Seguimiento de subidas apagado el 21/10/2026: no lo usa WordPress y era
; una pieza de la cadena de PHP2Shell (CVE-2026-109618/109619).
session.upload_progress.enabled = Off
